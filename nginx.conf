server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;

    # The API is reverse-proxied by the host Nginx (not configured yet).
    # Fail explicitly instead of returning index.html for /api/ calls.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"API reverse proxy is not configured for this frontend"}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CRA hashed assets: safe to cache for a year
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpe?g|gif|svg|webp|ico|webm|mp4|woff2?|ttf|otf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback (BrowserRouter)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
